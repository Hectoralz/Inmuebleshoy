<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asesor | InmuebleHoy</title>
<meta name="description" content="Contacto y propiedades de tu asesor de InmuebleHoy en Zacatecas y Guadalupe.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0ED;--surface:#FFFFFF;--ink:#1C2230;--muted:#5E6573;--line:#E2DED8;
  --accent:#0E5E5A;--rose:#B4766A;--wa:#128C4A;--wa-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14181E;--surface:#1C2229;--ink:#ECEEF1;--muted:#9AA2AE;--line:#2B323B;
    --accent:#5CC0B8;--rose:#C98F83;--wa:#1FA85A;--wa-ink:#FFFFFF;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.5;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px 48px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:32px}
.brand a{color:inherit;text-decoration:none;font-weight:700}
.brand a:hover{color:var(--ink)}
.agent{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center}
.avatar{
  width:96px;height:96px;border-radius:50%;object-fit:cover;
  background:var(--rose);color:#FFFFFF;display:grid;place-items:center;
  font-family:"Young Serif",Georgia,serif;font-size:34px;
  border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);
}
h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(28px,7.5vw,36px);line-height:1.1;letter-spacing:-.01em;overflow-wrap:anywhere}
.role{color:var(--muted);font-size:15px;margin-top:6px}
.actions{display:grid;gap:10px;margin-top:28px}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:52px;padding:10px 12px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:15px;font-weight:600;line-height:1.2;
  text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.btn.wa{background:var(--wa);border-color:var(--wa);color:var(--wa-ink);font-size:16px;min-height:58px}
.btn:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.phone{margin-top:14px;font-size:15px;color:var(--muted);text-align:center}
.props{margin-top:44px}
.props-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:24px;line-height:1.2}
.count{color:var(--muted);font-size:14px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:14px}
.card{display:grid;grid-template-columns:120px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:inherit;min-height:124px}
.card .ph{display:block;width:100%;height:100%;min-height:124px;object-fit:cover;background:var(--line)}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.op{align-self:flex-start;font-size:12px;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:6px;padding:0 7px;margin-bottom:2px}
.price{font-weight:700;font-size:18px;line-height:1.3}
.price small{font-weight:500;font-size:13px;color:var(--muted)}
.title{font-size:15px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.place,.specs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--muted)}
.note h1{color:var(--ink);margin-bottom:10px}
.note a,.note button{color:var(--accent);font-weight:700;background:none;border:0;font-family:inherit;font-size:inherit;cursor:pointer;text-decoration:underline;padding:0}
.note p+p{margin-top:12px}
.sk{background:linear-gradient(90deg,var(--line) 0%,var(--surface) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
footer{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}
footer a{color:inherit;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.adm{border-bottom:1px solid var(--line);padding:14px 0;display:grid;gap:8px}
.adm strong{font-size:16px}
.adm code{font-size:12px;color:var(--muted);word-break:break-all}
.adm .btn{min-height:44px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <a href="https://inmuebleshoy.mx/">InmuebleHoy</a>
    <span>Zacatecas y Guadalupe</span>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer><a href="https://inmuebleshoy.mx/">Ver más propiedades en inmuebleshoy.mx</a></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  'use strict';

  var DB = 'https://inmuebleshoy-1b606-default-rtdb.firebaseio.com';
  var PROP_NODES = ['properties', 'props', 'propiedades'];
  var AGENCY_WA = '524921412672';
  var app = document.getElementById('app');

  var NAME_KEYS = ['name', 'nombre', 'fullName', 'displayName'];
  var PHONE_KEYS = ['whatsapp', 'phone', 'telefono', 'tel', 'celular', 'mobile'];
  var EMAIL_KEYS = ['email', 'correo'];
  var PHOTO_KEYS = ['photo', 'foto', 'photoURL', 'avatar', 'img', 'image'];

  function clean(s) {
    return String(s == null ? '' : s).replace(/[\u200B-\u200D\u2060\uFEFF\u00A0]/g, '').trim();
  }
  function esc(s) {
    return clean(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slug(s) {
    return clean(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  function pick(o, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = o[keys[i]];
      if (v !== undefined && v !== null && typeof v !== 'object' && clean(v) !== '') return v;
      if (v && typeof v === 'object') return v;
    }
    return '';
  }
  function text(o, keys) {
    var v = pick(o, keys);
    return typeof v === 'object' ? '' : clean(v);
  }
  function num(s) {
    var mt = clean(s).replace(/,/g, '').match(/\d+(?:\.\d+)?/);
    return mt ? mt[0] : '';
  }
  function digits(s) { return clean(s).replace(/\D/g, ''); }
  function waNum(d) {
    if (!d) return '';
    if (d.length === 10) return '521' + d;
    if (d.length === 12 && d.indexOf('52') === 0) return '521' + d.slice(2);
    return d;
  }
  function last10(d) { return d.length >= 10 ? d.slice(-10) : d; }
  function fmtPhone(d) {
    var t = last10(d);
    return t.length === 10 ? t.slice(0, 3) + ' ' + t.slice(3, 6) + ' ' + t.slice(6) : t;
  }
  function safeImg(u) {
    u = typeof u === 'string' ? clean(u) : '';
    return /^(https?:\/\/|data:image\/)/i.test(u) ? u : '';
  }
  function firstPhoto(p) {
    var v = pick(p, ['photos', 'fotos', 'images', 'imagenes', 'gallery', 'photo', 'foto', 'img', 'image', 'cover']);
    if (v && typeof v === 'object') {
      var arr = Array.isArray(v) ? v : Object.keys(v).map(function (k) { return v[k]; });
      v = arr.length ? arr[0] : '';
    }
    if (v && typeof v === 'object') v = v.url || v.secure_url || v.src || '';
    return safeImg(v);
  }
  function money(v) {
    var n = Number(clean(v).replace(/[^\d.]/g, ''));
    if (!isFinite(n) || n <= 0) return '';
    return '$' + Math.round(n).toLocaleString('es-MX');
  }
  function joinVals(p, keys) {
    return keys.map(function (k) { var v = p[k]; return typeof v === 'object' ? '' : clean(v); }).join(' ').toLowerCase();
  }
  function opOf(p) {
    var t = joinVals(p, ['operation', 'operacion', 'op', 'tipoOperacion', 'transaction', 'listingType', 'type', 'tipo', 'category', 'categoria']);
    if (t.indexOf('rent') > -1) return 'renta';
    if (t.indexOf('vent') > -1 || t.indexOf('sale') > -1) return 'venta';
    return '';
  }
  function isArchived(p) {
    if (p.archived === true || p.archivado === true || p.archived === 'true') return true;
    var s = joinVals(p, ['archiveStatus', 'status', 'estado', 'estatus']);
    return s.indexOf('vendid') > -1 || s.indexOf('rentad') > -1 || s.indexOf('archiv') > -1 || s.indexOf('sold') > -1;
  }
  function stamp(p) {
    var v = p.createdAt || p.timestamp || p.created || p.fecha || p.date || 0;
    var n = typeof v === 'number' ? v : Date.parse(v);
    return isFinite(n) ? n : 0;
  }
  function getJSON(path) {
    return fetch(DB + '/' + path + '.json', { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function findAgent(agents, key) {
    var ids = Object.keys(agents);
    var i, id, a;
    for (i = 0; i < ids.length; i++) {
      id = ids[i]; a = agents[id];
      if (a && typeof a === 'object' && clean(id) === key) return { id: clean(id), a: a };
    }
    var lk = key.toLowerCase(), ks = slug(key);
    for (i = 0; i < ids.length; i++) {
      id = ids[i]; a = agents[id];
      if (!a || typeof a !== 'object') continue;
      var nm = slug(text(a, NAME_KEYS));
      var em = text(a, EMAIL_KEYS).toLowerCase();
      if ((ks && nm === ks) || (em && em === lk) || (a.uid && clean(a.uid) === key)) return { id: clean(id), a: a };
    }
    return null;
  }

  async function loadProps(agentId, a) {
    var email = text(a, EMAIL_KEYS).toLowerCase();
    var uid = clean(a.uid);
    var fetched = false;
    for (var i = 0; i < PROP_NODES.length; i++) {
      var data;
      try { data = await getJSON(PROP_NODES[i]); fetched = true; } catch (e) { continue; }
      if (!data || typeof data !== 'object' || !Object.keys(data).length) continue;
      return Object.keys(data).map(function (k) {
        var p = data[k];
        if (p && typeof p === 'object') p.__id = k;
        return p;
      }).filter(function (p) {
        if (!p || typeof p !== 'object' || isArchived(p)) return false;
        var aid = text(p, ['agentId', 'agentUid', 'agenteId', 'agente', 'agent', 'assignedAgent']);
        var aem = text(p, ['agentEmail', 'emailAgente', 'agenteEmail']).toLowerCase();
        return aid === agentId || (uid && aid === uid) || (email && aem === email);
      }).sort(function (x, y) { return stamp(y) - stamp(x); });
    }
    if (!fetched) throw new Error('no data');
    return [];
  }

  function renderNote(title, html) {
    app.innerHTML = '<div class="note"><h1>' + esc(title) + '</h1>' + html + '</div>';
  }

  function renderSkeleton() {
    app.innerHTML =
      '<div class="agent"><div class="sk" style="width:96px;height:96px;border-radius:50%"></div>' +
      '<div><div class="sk" style="height:32px;width:80%"></div><div class="sk" style="height:16px;width:55%;margin-top:10px"></div></div></div>' +
      '<div class="sk" style="height:58px;margin-top:28px"></div>' +
      '<div class="sk" style="height:124px;margin-top:44px"></div>' +
      '<div class="sk" style="height:124px;margin-top:14px"></div>';
  }

  function cardHTML(p, waBase, agentName) {
    var title = text(p, ['title', 'titulo', 'nombre', 'name']) || 'Propiedad';
    var op = opOf(p);
    var price = money(text(p, ['price', 'precio']));
    var place = [text(p, ['colonia', 'zone', 'zona', 'neighborhood', 'fraccionamiento']), text(p, ['city', 'ciudad', 'municipio'])]
      .filter(Boolean).join(', ');
    var specs = [];
    var b = num(text(p, ['bedrooms', 'recamaras', 'habitaciones', 'rooms', 'beds']));
    var ba = num(text(p, ['bathrooms', 'banos', 'baños', 'baths']));
    var m = num(text(p, ['m2', 'area', 'superficie', 'size', 'metros', 'construccion']));
    if (b) specs.push(b + (b === '1' ? ' recámara' : ' recámaras'));
    if (ba) specs.push(ba + (ba === '1' ? ' baño' : ' baños'));
    if (m) specs.push(m + ' m²');
    var photo = firstPhoto(p);
    var msg = 'Hola ' + agentName + ', me interesa la propiedad "' + title + '" que vi en InmuebleHoy.';
    var href = 'https://wa.me/' + waBase + '?text=' + encodeURIComponent(msg);
    return '<a class="card" data-op="' + op + '" href="' + esc(href) + '" target="_blank" rel="noopener">' +
      (photo ? '<img class="ph" src="' + esc(photo) + '" alt="" loading="lazy">' : '<div class="ph"></div>') +
      '<div class="body">' +
        (op ? '<span class="op">' + (op === 'renta' ? 'Renta' : 'Venta') + '</span>' : '') +
        (price ? '<div class="price">' + esc(price) + (op === 'renta' ? '<small> /mes</small>' : '') + '</div>' : '') +
        '<div class="title">' + esc(title) + '</div>' +
        (place ? '<div class="place">' + esc(place) + '</div>' : '') +
        (specs.length ? '<div class="specs">' + esc(specs.join(', ')) + '</div>' : '') +
      '</div></a>';
  }

  function renderAgent(id, a, props) {
    var name = text(a, NAME_KEYS) || 'Asesor inmobiliario';
    var first = name.split(/\s+/)[0];
    var d = digits(text(a, PHONE_KEYS));
    var wa = waNum(d) || AGENCY_WA;
    var tel = d ? '+52' + last10(d) : '';
    var email = text(a, EMAIL_KEYS);
    var photo = safeImg(text(a, PHOTO_KEYS));
    var initials = name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w.charAt(0); }).join('').toUpperCase();
    document.title = name + ' | InmuebleHoy';

    var waHref = 'https://wa.me/' + wa + '?text=' + encodeURIComponent('Hola ' + first + ', vi tu tarjeta de InmuebleHoy y me gustaría recibir información.');
    var row = '';
    if (tel) row += '<a class="btn" href="tel:' + esc(tel) + '">Llamar</a>';
    if (email) row += '<a class="btn" href="mailto:' + esc(email) + '">Correo</a>';
    row += '<button class="btn" type="button" id="saveBtn">Guardar contacto</button>';

    var html =
      '<section class="agent">' +
        (photo ? '<img class="avatar" src="' + esc(photo) + '" alt="' + esc(name) + '">' : '<div class="avatar" aria-hidden="true">' + esc(initials) + '</div>') +
        '<div><h1>' + esc(name) + '</h1><p class="role">Asesor inmobiliario en InmuebleHoy</p></div>' +
      '</section>' +
      '<div class="actions">' +
        '<a class="btn wa" href="' + esc(waHref) + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>' +
        '<div class="row">' + row + '</div>' +
      '</div>' +
      (d ? '<p class="phone">' + esc(fmtPhone(d)) + (email ? '<br>' + esc(email) : '') + '</p>' : (email ? '<p class="phone">' + esc(email) + '</p>' : '')) +
      '<section class="props" aria-labelledby="ph">';

    if (props === null) {
      html += '<h2 id="ph">Propiedades</h2><div class="note" style="margin-top:14px"><p>No se pudieron cargar las propiedades. <button type="button" id="retry">Intentar de nuevo</button></p></div>';
    } else if (!props.length) {
      html += '<h2 id="ph">Propiedades</h2><div class="note" style="margin-top:14px"><p>' + esc(first) + ' no tiene propiedades publicadas en este momento. Escríbele por WhatsApp para conocer opciones disponibles.</p></div>';
    } else {
      var hasV = props.some(function (p) { return opOf(p) === 'venta'; });
      var hasR = props.some(function (p) { return opOf(p) === 'renta'; });
      html += '<div class="props-head"><h2 id="ph">Sus propiedades</h2><span class="count" id="count">' + props.length + (props.length === 1 ? ' publicada' : ' publicadas') + '</span></div>';
      if (hasV && hasR) {
        html += '<div class="tabs" role="group" aria-label="Filtrar propiedades">' +
          '<button class="tab" type="button" data-f="" aria-pressed="true">Todas</button>' +
          '<button class="tab" type="button" data-f="venta" aria-pressed="false">Venta</button>' +
          '<button class="tab" type="button" data-f="renta" aria-pressed="false">Renta</button></div>';
      }
      html += '<div class="list" id="list">' + props.map(function (p) { return cardHTML(p, wa, first); }).join('') + '</div>';
    }
    html += '</section>';
    app.innerHTML = html;

    document.getElementById('saveBtn').addEventListener('click', function () { saveContact(name, tel, email); });
    var retry = document.getElementById('retry');
    if (retry) retry.addEventListener('click', function () { location.reload(); });

    var tabs = app.querySelectorAll('.tab');
    Array.prototype.forEach.call(tabs, function (tab) {
      tab.addEventListener('click', function () {
        var f = tab.getAttribute('data-f');
        Array.prototype.forEach.call(tabs, function (t) { t.setAttribute('aria-pressed', t === tab ? 'true' : 'false'); });
        var cards = app.querySelectorAll('.card');
        var shown = 0;
        Array.prototype.forEach.call(cards, function (c) {
          var ok = !f || c.getAttribute('data-op') === f;
          c.style.display = ok ? '' : 'none';
          if (ok) shown++;
        });
        document.getElementById('count').textContent = shown + (shown === 1 ? ' publicada' : ' publicadas');
      });
    });
  }

  function vEsc(s) {
    return clean(s).replace(/\\/g, '\\\\').replace(/[,;]/g, function (c) { return '\\' + c; });
  }
  function saveContact(name, tel, email) {
    var lines = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + vEsc(name) + ';;;;', 'FN:' + vEsc(name), 'ORG:InmuebleHoy Realty', 'TITLE:Asesor inmobiliario'];
    if (tel) lines.push('TEL;TYPE=CELL:' + tel);
    if (email) lines.push('EMAIL;TYPE=INTERNET:' + email);
    lines.push('URL:' + location.href.split('#')[0]);
    lines.push('END:VCARD');
    try {
      var blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/vcard;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = (slug(name) || 'contacto') + '.vcf';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      toast('Abre el archivo para agregar el contacto');
    } catch (e) {
      toast('No se pudo crear el contacto en este navegador');
    }
  }

  async function renderList() {
    var m = document.createElement('meta');
    m.name = 'robots'; m.content = 'noindex';
    document.head.appendChild(m);
    renderSkeleton();
    var agents;
    try { agents = (await getJSON('agents')) || {}; } catch (e) {
      renderNote('No se pudo cargar la lista', '<p><button type="button" onclick="location.reload()">Intentar de nuevo</button></p>');
      return;
    }
    var base = location.origin + location.pathname + '?id=';
    var rows = Object.keys(agents).filter(function (k) { return agents[k] && typeof agents[k] === 'object'; }).map(function (k) {
      var url = base + encodeURIComponent(clean(k));
      return '<div class="adm"><strong>' + esc(text(agents[k], NAME_KEYS) || 'Sin nombre') + '</strong><code>' + esc(url) + '</code>' +
        '<div class="row"><a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Abrir</a>' +
        '<button class="btn" type="button" data-url="' + esc(url) + '">Copiar link</button></div></div>';
    });
    app.innerHTML = '<h1>Links para tarjetas NFC</h1><p class="role">Graba cada link en su tarjeta con NFC Tools.</p>' +
      (rows.length ? rows.join('') : '<div class="note" style="margin-top:14px"><p>No hay asesores registrados.</p></div>');
    Array.prototype.forEach.call(app.querySelectorAll('[data-url]'), function (b) {
      b.addEventListener('click', function () {
        var u = b.getAttribute('data-url');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(u).then(function () { toast('Link copiado'); }, function () { toast(u); });
        } else { toast(u); }
      });
    });
  }

  async function main() {
    var q = new URLSearchParams(location.search);
    if (q.has('lista')) return renderList();
    var key = clean(q.get('id') || q.get('a') || q.get('agente') || '');
    if (!key) {
      renderNote('Falta el asesor en el enlace', '<p>Este enlace debe incluir el asesor, por ejemplo <code>agente.html?id=...</code></p><p><a href="https://inmuebleshoy.mx/">Ir a InmuebleHoy</a></p>');
      return;
    }
    renderSkeleton();
    var agents;
    try { agents = (await getJSON('agents')) || {}; } catch (e) {
      renderNote('No se pudo cargar la información', '<p>Revisa tu conexión. <button type="button" onclick="location.reload()">Intentar de nuevo</button></p>');
      return;
    }
    var found = findAgent(agents, key);
    if (!found) {
      renderNote('No encontramos a este asesor', '<p>El enlace puede estar incompleto o el asesor ya no está activo.</p><p><a href="https://inmuebleshoy.mx/">Ver propiedades en InmuebleHoy</a></p>');
      return;
    }
    var props;
    try { props = await loadProps(found.id, found.a); } catch (e) { props = null; }
    renderAgent(found.id, found.a, props);
  }

  main();
})();
</script>
</body>
</html>
